aid: imper
name: Imper
description: >-
  Imper (imper.ai) is a workforce identity-verification and impersonation-defense
  platform that detects and prevents social-engineering and AI-driven deception
  attacks across the entire employee lifecycle. Rather than guarding against
  unauthorized break-ins, Imper confirms that the person on a call, video meeting,
  candidate interview, help-desk request, or account-recovery flow is the real,
  authorized employee. Its agentless engine analyzes network, device, and digital
  identity markers combined with organizational context, and pairs an
  impersonation-detection layer that spots attacker-controlled environments with
  an AI-driven contextual verification layer that confirms real employees through
  dynamic, work-based questioning. Imper integrates natively with ITSM, HR, and
  ATS systems (Workday, Greenhouse, ServiceNow and more) to enforce identity
  assurance at high-risk lifecycle events such as hiring, enrollment, help-desk
  support, and continuous verification. Founded in 2022 and headquartered in Tel
  Aviv, the company is backed by Redpoint Ventures, Battery Ventures, Maple
  Capital, Vesey Ventures, and Cerca Partners.
